name: Build & Deploy FX Dashboard

on:
  schedule:
    # 16:30 UTC, lunes a viernes — el BCE publica las tasas hacia las 16:00 UTC.
    - cron: "30 16 * * 1-5"
  workflow_dispatch:        # permite lanzar manualmente desde GitHub
  push:
    branches: [main]        # redespliega al hacer push

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar dashboard
        run: |
          mkdir -p _site
          python fx_dashboard.py --no-abrir --salida _site/index.html
          cp icon.svg _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
